[project]
name = "occamworm"
version = "0.0.1"
description = "Compact neural update rules that predict causal responses in C. elegans."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15", "scipy>=1.13", "jax>=0.4.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Repository = "https://github.com/Lulzx/occam-worm"

# Pure Python until the first C++ ticket (OW-008); the build backend then moves to scikit-build-core
# with nanobind bindings (docs/engineering/REPRODUCIBILITY.md).
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/occamworm"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/leakage"]
pythonpath = ["python"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/occamworm"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*", "jax", "jax.*"]
ignore_missing_imports = true
