# Shared-timescale baseline benchmark (§4, §14.6). Read by `python -m occamworm.baselines benchmark`.
# Frozen 2026-10-08 before any outer fold was scored; changes require a new experiment name.
# v2 (2026-10-12): the T2b indicator uses published GCaMP6s kinetics ([indicator]) instead of a per-fold fit to
# autoresponses, which came out at the alpha limit with tau ~ 11.5 s (an effective stimulus-to-calcium response,
# not the sensor). No T2b outer fold had been scored. T2a is unaffected and stays the v1 run (f0de9f4).

[experiment]
name = "shared-timescales-wt-v2"
question = "Do shared response timescales generalize across animals?"
primary_condition = "wild-type"
primary_metric = "animal_paired_predictive_nll_difference"
primary_task = "T2a"
secondary_tasks = ["T2b"]

[data]
dataset = "randi2023-wt-v1"
eligibility = "artifacts/audit-v2/target_eligibility.parquet"
use_individual_trials = true
include_valid_near_null_responses = true
calibration_policy = "pre_stimulus_only"       # dF/F baseline and noise scale from the trial's own pre-stimulus window
# Open decision 13: history term. Both variants are fitted; per outer fold the variant with the better
# inner-validation score is selected, and both are reported.
history_terms = ["none", "pre_stimulus_slope_and_stim_index"]
initial_state_policy = "history_conditioned"

[splits]
split = "data/splits/randi2023-wt-v1-loao/split.json"   # leave-one-animal-out x 5 inner folds (OW-004)

[models]
families = ["B0", "B1", "B1d", "B2-K1", "B2-K2", "B2-K4", "B2-K8", "B3", "B4-fixed", "B4-learned"]
ridge_grid = [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]   # relative to median trace(G_p)/M of the training data
kernel_knots_volumes = [0, 1, 2, 4, 6, 9, 13, 18, 25, 33, 43, 59]
b1d_delays_volumes = [-2, -1, 0, 1, 2]

[observation]
# Open decision 3: Gaussian AR(1) residuals, sigma_n^2 = a^2 s_n^2 + b^2, fitted on training residuals only.
family = "gaussian_ar1"
fit_noise_on = "training_only"
allow_test_specific_scale_calibration = false
indicator_stage = "published"   # fixed GCaMP6s kinetics below; the autoresponse fit is reported as a diagnostic
indicator_control = true

[indicator]
# Difference of exponentials (s). No direct measurement exists for nuclear GCaMP6s in C. elegans; the central values
# extrapolate from the sources below, and the ranges are the uncertainty used by the §4.5 control.
# - Chen et al. 2013, Nature 499:295: spikes resolvable at intervals of the sensor rise time, 100-150 ms for GCaMP6s
#   (mouse V1, 37 C); the floor of tau_r.
# - Helassa et al. 2016, Sci Rep 6:38276: purified GCaMP6s Ca2+-dissociation t1/2 769 ms at 20 C, 346 ms at 37 C.
# - Ding et al. 2023, G3 13:jkad183: cytosolic GCaMP6s in C. elegans ALM, decay tau 8.4 +/- 5.0 s after a 3-s touch
#   train (includes Ca2+ clearance); the ceiling of tau_d.
# Nuclear localization, ~20 C imaging and 0.5 s volumes (Randi et al. 2023) all slow the effective response.
sensor = "GCaMP6s, nuclear-localized (AML462)"
source = "Chen 2013; Helassa 2016; Ding 2023 (extrapolated, see config comments)"
tau_r_s = 0.4
tau_r_range_s = [0.15, 1.0]
tau_d_s = 2.5
tau_d_range_s = [1.0, 8.4]

[indicator_control]
# Open decision 14: a false-sharing rate at or below this value counts as low.
false_sharing_threshold = 0.05
false_sharing_replicates = 40
false_sharing_seed = 20261008

[report]
bootstrap_unit = "animal"
bootstrap_replicates = 2000
confidence_level = 0.95
report_all_stim_targets = true
